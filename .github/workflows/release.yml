name: Release

# Run manually from the Actions tab. Each run opens or updates the release PR
# that bumps the version and updates CHANGELOG.md from the Conventional Commits
# on main. After merging that PR, run this workflow once more to tag vX.Y.Z
# and publish the GitHub release. No build artifacts are produced.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/release-please-action v5.0.0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
